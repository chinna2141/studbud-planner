<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studbud: AI Personalized Study Planner</title>
    <link rel="stylesheet"href="style.css">
    </head>
<body>
    <h1>Studbud: AI Personalized Study Planner</h1>

    <div class="container">
        <h2>Student Information</h2>

        <label for="studentName">Student Name:</label>
        <input type="text" id="studentName" placeholder="Enter your name">

        <label for="academicGoals">Academic Goals:</label>
        <textarea id="academicGoals" rows="3" placeholder="e.g., Achieve a GPA of 3.8 or higher"></textarea>

        <label for="strengths">Strengths (comma-separated):</label>
        <input type="text" id="strengths" placeholder="e.g., Math, Reading">

        <label for="weaknesses">Weaknesses (comma-separated):</label>
        <input type="text" id="weaknesses" placeholder="e.g., Writing, Memorization">

        <label for="availableHours">Available Study Hours per Week:</label>
        <input type="number" id="availableHours" placeholder="Enter total hours">

        <h2>Courses</h2>

        <div id="coursesContainer">
            <!-- Initial course input fields -->
            <div class="course">
                <label for="courseName1">Course Name:</label>
                <input type="text" id="courseName1" name="courseName" placeholder="Enter course name">

                <label for="courseCredits1">Credits:</label>
                <input type="number" id="courseCredits1" name="courseCredits" placeholder="Enter credits">

                <label for="courseDifficulty1">Difficulty:</label>
                <select id="courseDifficulty1" name="courseDifficulty">
                    <option value="Easy">Easy</option>
                    <option value="Medium">Medium</option>
                    <option value="Hard">Hard</option>
                </select>
            </div>
        </div>

        <button id="addCourse">Add Course</button>
        <button id="generateSchedule">Generate Schedule</button>

        <div id="scheduleOutput">
            <h2>Generated Study Schedule</h2>
            <ul id="scheduleList">
                <!-- Study schedule will be dynamically added here -->
            </ul>
        </div>
    </div>

    <script>
        let courseCount = 1; // Keep track of the number of course inputs

        document.getElementById("addCourse").addEventListener("click", function() {
            courseCount++;

            const coursesContainer = document.getElementById("coursesContainer");
            const newCourseDiv = document.createElement("div");
            newCourseDiv.classList.add("course");

            newCourseDiv.innerHTML = `
                <label for="courseName${courseCount}">Course Name:</label>
                <input type="text" id="courseName${courseCount}" name="courseName" placeholder="Enter course name">

                <label for="courseCredits${courseCount}">Credits:</label>
                <input type="number" id="courseCredits${courseCount}" name="courseCredits" placeholder="Enter credits">

                <label for="courseDifficulty${courseCount}">Difficulty:</label>
                <select id="courseDifficulty${courseCount}" name="courseDifficulty">
                    <option value="Easy">Easy</option>
                    <option value="Medium">Medium</option>
                    <option value="Hard">Hard</option>
                </select>
            `;

            coursesContainer.appendChild(newCourseDiv);
        });

        document.getElementById("generateSchedule").addEventListener("click", function() {
            // Get student information
            const studentName = document.getElementById("studentName").value;
            const academicGoals = document.getElementById("academicGoals").value;
            const strengths = document.getElementById("strengths").value.split(",").map(item => item.trim()); // Split strengths by comma
            const weaknesses = document.getElementById("weaknesses").value.split(",").map(item => item.trim()); // Split weaknesses by comma
            const availableHours = parseInt(document.getElementById("availableHours").value);

            // Get course information
            const courses = [];
            for (let i = 1; i <= courseCount; i++) {
                const courseName = document.getElementById(`courseName${i}`).value;
                const courseCredits = parseInt(document.getElementById(`courseCredits${i}`).value);
                const courseDifficulty = document.getElementById(`courseDifficulty${i}`).value;

                courses.push({
                    name: courseName,
                    credits: courseCredits,
                    difficulty: courseDifficulty
                });
            }

            // Basic validation (add more as needed)
            if (!studentName || !academicGoals || !strengths || !weaknesses || isNaN(availableHours) || availableHours <= 0) {
                alert("Please fill in all fields with valid data.");
                return;
            }

            if (courses.length === 0 || courses.some(course => !course.name || isNaN(course.credits) || course.credits <= 0)) {
                alert("Please add at least one course with valid information.");
                return;
            }

            // **Placeholder for AI logic**
            // This is where you would integrate your Python script with the AI (BERT) to generate the schedule
            // For now, we'll create a very simple, static schedule

            const schedule = {
                "Monday": ["Course 1 (2 hours)", "Course 2 (1 hour)"],
                "Tuesday": ["Course 3 (2 hours)", "Course 1 (1 hour)"],
                "Wednesday": ["Course 2 (2 hours)"],
                "Thursday": ["Course 1 (1 hour)", "Course 3 (1 hour)", "Course 4 (1 hour)"],
                "Friday": ["Course 4 (2 hours)", "Course 2 (1 hour)"],
                "Saturday": [],
                "Sunday": ["Catch up (1 hour)"]
            };

            // Display the schedule in the scheduleOutput div
            const scheduleList = document.getElementById("scheduleList");
            scheduleList.innerHTML = ""; // Clear previous schedule

            for (const day in schedule) {
                if (schedule.hasOwnProperty(day)) {
                    const daySchedule = schedule[day];
                    const dayItem = document.createElement("li");
                    dayItem.innerHTML = `<strong>${day}:</strong>`;

                    if (daySchedule.length > 0) {
                        const sessionList = document.createElement("ul");
                        daySchedule.forEach(session => {
                            const sessionItem = document.createElement("li");
                            sessionItem.textContent = session;
                            sessionList.appendChild(sessionItem);
                        });
                        dayItem.appendChild(sessionList);
                    } else {
                        dayItem.innerHTML += "  No sessions scheduled.";
                    }
                    scheduleList.appendChild(dayItem);
                }
            }


            // Example display:
            // document.getElementById("scheduleOutput").innerText = "This is where the AI-generated schedule will appear.";
        });

    </script>
</body>
</html>
